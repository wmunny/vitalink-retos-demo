<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vitalink Retos · Panel de empresa (maqueta)</title>
<meta name="description" content="Maqueta navegable del panel de empresa de Vitalink Retos: retos, clasificaciones, comunicación, premios e informes. Datos ficticios.">
<style>
  :root {
    color-scheme: light;
    --brand: #0F7A5C; --brand-dark: #0A5A44; --brand-soft: #E3F1EB; --brand-softer: #F1F8F4;
    --ground: #F4F6F3; --card: #FFFFFF; --line: #E2E7E4; --ink: #17201C; --muted: #5A6762;
    --warm: #C2610F; --warm-soft: #FFF1E6; --pink: #C2185B; --pink-soft: #FCE7F0;
    --red: #A3261B; --red-soft: #FDECEA; --blue: #1F5FA8; --blue-soft: #E7F0FA;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--ground); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--brand); }

  .demo-banner { background: var(--ink); color: #fff; font-size: 13px; padding: 7px 16px; text-align: center; }
  .demo-banner b { color: #8FE0BF; }

  .app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: calc(100vh - 34px); }
  aside { background: #fff; border-right: 1px solid var(--line); padding: 18px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .logo { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
  .logo-mark { width: 36px; height: 36px; border-radius: 10px; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 800; }
  .logo b { display: block; font-size: 15px; }
  .logo span { font-size: 12px; color: var(--muted); }
  nav button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 10px; cursor: pointer; color: var(--muted); font-weight: 600; }
  nav button:hover { background: var(--ground); color: var(--ink); }
  nav button[aria-current="page"] { background: var(--brand-soft); color: var(--brand-dark); }
  nav svg { width: 18px; height: 18px; flex: none; }
  .nav-badge { margin-left: auto; background: var(--warm); color: #fff; font-size: 11px; border-radius: 999px; padding: 1px 7px; }
  .company-box { margin-top: 18px; padding: 12px; border-radius: 12px; background: var(--ground); font-size: 13px; }
  .company-box b { display: block; }

  main { padding: 24px 28px 60px; min-width: 0; }
  .page-head { display: flex; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .page-head h1 { margin: 0; font-size: 26px; letter-spacing: -.3px; }
  .page-head p { margin: 4px 0 0; color: var(--muted); }
  .page-head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

  .grid { display: grid; gap: 16px; }
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .span2 { grid-column: span 2; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; min-width: 0; }
  .card h2 { font-size: 16px; margin: 0 0 4px; }
  .card .sub { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .card-head { display: flex; align-items: start; gap: 12px; }
  .card-head > div:first-child { flex: 1; }

  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .kpi .label { color: var(--muted); font-size: 13px; }
  .kpi .value { font-size: 28px; font-weight: 800; letter-spacing: -.5px; margin: 2px 0; font-variant-numeric: tabular-nums; }
  .kpi .delta { font-size: 12px; color: var(--brand-dark); font-weight: 600; }
  .kpi .delta.neutral { color: var(--muted); font-weight: 500; }

  .btn { border: 1px solid var(--brand); background: var(--brand); color: #fff; padding: 9px 16px; border-radius: 10px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
  .btn:hover { background: var(--brand-dark); }
  .btn.secondary { background: #fff; color: var(--brand-dark); border-color: #BBD9CC; }
  .btn.secondary:hover { background: var(--brand-softer); }
  .btn.ghost { background: none; border-color: transparent; color: var(--brand-dark); }
  .btn.danger { background: #fff; color: var(--red); border-color: #E8BDB8; }
  .btn.small { padding: 5px 10px; font-size: 13px; }
  .btn:disabled { opacity: .45; cursor: default; }

  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--ground); color: var(--muted); white-space: nowrap; }
  .chip.green { background: var(--brand-soft); color: var(--brand-dark); }
  .chip.warm { background: var(--warm-soft); color: #8A430B; }
  .chip.pink { background: var(--pink-soft); color: #8E1243; }
  .chip.blue { background: var(--blue-soft); color: #174A84; }
  .chip.red { background: var(--red-soft); color: var(--red); }

  .progress { height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .progress > i { display: block; height: 100%; background: var(--brand); border-radius: 999px; }
  .progress.pink > i { background: var(--pink); }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.muted td { color: var(--muted); }
  .table-wrap { overflow-x: auto; }

  .rank { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .rank:last-child { border-bottom: 0; }
  .rank .pos { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; background: var(--ground); color: var(--muted); flex: none; }
  .rank .pos.p1 { background: #F7D774; color: #6B5100; }
  .rank .pos.p2 { background: #DADFE3; color: #48525A; }
  .rank .pos.p3 { background: #EBC3A0; color: #6B3A10; }
  .rank .who { flex: 1; min-width: 0; }
  .rank .who b { display: block; }
  .rank .who span { font-size: 12px; color: var(--muted); }
  .rank .score { font-weight: 800; color: var(--brand-dark); font-variant-numeric: tabular-nums; }
  .bar-inline { height: 6px; border-radius: 999px; background: var(--line); margin-top: 5px; }
  .bar-inline i { display: block; height: 100%; border-radius: 999px; background: var(--brand); }

  .tabs { display: inline-flex; background: var(--ground); border-radius: 12px; padding: 4px; gap: 2px; flex-wrap: wrap; }
  .tabs button { border: 0; background: none; padding: 7px 14px; border-radius: 9px; cursor: pointer; font-weight: 600; color: var(--muted); }
  .tabs button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

  .challenge { display: flex; gap: 16px; align-items: stretch; }
  .challenge .art { width: 120px; flex: none; border-radius: 12px; display: grid; place-items: center; font-size: 40px; }
  .challenge .body { flex: 1; min-width: 0; }
  .challenge h3 { margin: 6px 0 2px; font-size: 17px; }
  .meta { color: var(--muted); font-size: 13px; }
  .stack { display: grid; gap: 12px; }

  label.field { display: block; font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 12px; }
  label.field > input, label.field > select, label.field > textarea { display: block; width: 100%; margin-top: 5px; padding: 9px 11px; border: 1px solid #C9D2CE; border-radius: 10px; background: #fff; font-weight: 400; color: var(--ink); }
  textarea { min-height: 96px; resize: vertical; }
  .inline-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0 12px; }

  .option-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .option { text-align: left; border: 1.5px solid var(--line); background: #fff; border-radius: 14px; padding: 14px; cursor: pointer; display: grid; gap: 4px; }
  .option:hover { border-color: #A9CDBE; }
  .option[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-softer); box-shadow: inset 0 0 0 1px var(--brand); }
  .option .emoji { font-size: 26px; }
  .option b { font-size: 14px; }
  .option span { font-size: 12px; color: var(--muted); }

  .toggle { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .toggle:last-child { border-bottom: 0; }
  .toggle .txt { flex: 1; }
  .toggle .txt b { display: block; font-size: 14px; }
  .toggle .txt span { font-size: 12px; color: var(--muted); }
  .switch { width: 42px; height: 24px; border-radius: 999px; border: 0; background: #C9D2CE; position: relative; cursor: pointer; flex: none; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .15s; }
  .switch[aria-checked="true"] { background: var(--brand); }
  .switch[aria-checked="true"]::after { left: 21px; }

  .steps { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
  .steps button { border: 0; background: none; display: flex; align-items: center; gap: 8px; color: var(--muted); font-weight: 600; cursor: pointer; padding: 6px 8px 6px 4px; border-radius: 10px; }
  .steps button .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--line); font-size: 12px; }
  .steps button[aria-current="step"] { color: var(--ink); }
  .steps button[aria-current="step"] .n { background: var(--brand); color: #fff; }
  .steps button.done .n { background: var(--brand-soft); color: var(--brand-dark); }
  .wizard { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
  .wizard-foot { display: flex; justify-content: space-between; margin-top: 18px; gap: 8px; }

  .phone { width: 280px; margin: 0 auto; border-radius: 34px; background: #111; padding: 10px; box-shadow: 0 18px 40px rgba(16,40,30,.18); position: sticky; top: 20px; }
  .phone .screen { background: var(--ground); border-radius: 26px; overflow: hidden; height: 540px; display: flex; flex-direction: column; }
  .phone .status { height: 26px; font-size: 11px; display: flex; justify-content: space-between; padding: 6px 18px 0; color: var(--ink); font-weight: 600; }
  .phone .content { flex: 1; padding: 8px 12px; overflow: hidden; display: grid; gap: 8px; align-content: start; }
  .phone .tabbar { height: 52px; background: #fff; border-top: 1px solid var(--line); display: flex; justify-content: space-around; align-items: center; font-size: 10px; color: var(--muted); }
  .phone .tabbar .on { color: var(--brand-dark); font-weight: 700; }
  .pcard { background: #fff; border-radius: 16px; padding: 12px; border: 1px solid var(--line); }
  .pcard.hero { color: #fff; border: 0; }
  .pcard.hero .meta { color: rgba(255,255,255,.85); }
  .pcard h4 { margin: 0; font-size: 15px; }
  .prow { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 4px 0; }
  .prow b { margin-left: auto; color: var(--brand-dark); }
  .pmini { font-size: 11px; color: var(--muted); }

  .feed-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .feed-item:last-child { border-bottom: 0; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand-dark); font-weight: 800; flex: none; }
  .avatar.org { background: var(--brand); color: #fff; }
  .feed-item .txt { flex: 1; min-width: 0; }
  .feed-item .txt p { margin: 2px 0 4px; }

  .poster { border-radius: 18px; padding: 22px; color: #fff; background: linear-gradient(150deg, #0F7A5C 0%, #0A5A44 60%, #083F31 100%); display: grid; gap: 10px; position: relative; overflow: hidden; }
  .poster h3 { margin: 0; font-size: 24px; line-height: 1.15; }
  .poster .code { font: 800 20px ui-monospace, Consolas, monospace; background: rgba(255,255,255,.14); padding: 6px 10px; border-radius: 10px; justify-self: start; }
  .poster .qr { position: absolute; right: 18px; bottom: 18px; background: #fff; border-radius: 10px; padding: 6px; }

  .flag { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .flag:last-child { border-bottom: 0; }
  .flag .icon { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--warm-soft); font-size: 20px; }
  .flag .actions { display: flex; gap: 6px; }

  .funnel { display: grid; gap: 8px; }
  .funnel .step { display: grid; grid-template-columns: 170px 1fr 70px; gap: 12px; align-items: center; font-size: 14px; }
  .funnel .step .bar { height: 26px; border-radius: 8px; background: var(--brand); }

  .note { background: var(--blue-soft); color: #173E6B; border-radius: 12px; padding: 10px 14px; font-size: 13px; display: flex; gap: 10px; }
  .note.warm { background: var(--warm-soft); color: #6E3608; }
  .empty { text-align: center; color: var(--muted); padding: 24px; }

  .toast { position: fixed; bottom: 22px; left: 50%; transform: translate(-50%, 30px); background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 12px; font-size: 14px; opacity: 0; transition: .2s; pointer-events: none; z-index: 10; max-width: calc(100vw - 32px); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  svg.chart text { font-size: 11px; fill: var(--muted); }

  @media (max-width: 1100px) {
    .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .wizard { grid-template-columns: 1fr; }
    .phone { position: static; }
  }
  @media (max-width: 860px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .app > * { min-width: 0; }
    aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 12px 16px; }
    .logo { padding-bottom: 10px; }
    nav { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; }
    nav button { width: auto; white-space: nowrap; }
    .company-box { display: none; }
    main { padding: 18px 16px 48px; }
    .g2, .g3 { grid-template-columns: 1fr; }
    .span2 { grid-column: auto; }
    .funnel .step { grid-template-columns: 110px 1fr 56px; font-size: 13px; }
  }
  @media (max-width: 520px) {
    .g4 { grid-template-columns: 1fr 1fr; }
    .kpi .value { font-size: 22px; }
    .challenge { flex-direction: column; }
    .challenge .art { width: 100%; height: 72px; }
    .flag { grid-template-columns: auto 1fr; }
    .flag .actions { grid-column: 1 / -1; }
  }
</style>
</head>

<script>

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// es-ES no agrupa los números de 4 cifras («7940»); aquí siempre se agrupan («7.940»).
const fmt = (n, d = 0) => {
  const [int, dec] = Math.abs(Number(n)).toFixed(d).split(".");
  return (Number(n) < 0 ? "-" : "") + int.replace(/\B(?=(\d{3})+(?!\d))/g, ".") + (dec ? "," + dec : "");
};
const pct = (a, b) => (b ? Math.round((100 * a) / b) : 0);
let toastTimer;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);

// ------------------------------------------------------------------ gráficos
function barChart(values, { height = 170, max = 100, suffix = "%", labelEvery = 3, color = "var(--brand)", highlightWeekends = true } = {}) {
  const w = 640, padL = 30, padB = 22, padT = 8;
  const bw = (w - padL) / values.length;
  const h = height - padB - padT;
  const grid = [0, 25, 50, 75, 100].map((g) => {
    const y = padT + h - (g / max) * h;
    return `<line x1="${padL}" x2="${w}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${padL - 6}" y="${y + 4}" text-anchor="end">${g}${suffix}</text>`;
  }).join("");
  const bars = values.map((v, i) => {
    const bh = (v / max) * h;
    const x = padL + i * bw + 2;
    const dow = new Date(2026, 9, i + 1).getDay();
    const weekend = highlightWeekends && (dow === 0 || dow === 6);
    return `<rect x="${x}" y="${padT + h - bh}" width="${bw - 4}" height="${bh}" rx="3" fill="${weekend ? "#9DC9B6" : color}"><title>${i + 1} oct: ${v}${suffix}</title></rect>` +
      ((i + 1) % labelEvery === 1 || labelEvery === 1 ? `<text x="${x + (bw - 4) / 2}" y="${height - 6}" text-anchor="middle">${i + 1}</text>` : "");
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${w} ${height}" width="100%" role="img" aria-label="Participación diaria de octubre">${grid}${bars}</svg>`;
}

function qr(seed = 7, size = 84) {
  const n = 21, c = size / n;
  let r = seed, out = "";
  const rnd = () => ((r = (r * 9301 + 49297) % 233280) / 233280);
  const finder = (x, y) => (x < 7 && y < 7) || (x >= n - 7 && y < 7) || (x < 7 && y >= n - 7);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    let on;
    if (finder(x, y)) {
      const fx = x >= n - 7 ? x - (n - 7) : x, fy = y >= n - 7 ? y - (n - 7) : y;
      on = fx === 0 || fx === 6 || fy === 0 || fy === 6 || (fx >= 2 && fx <= 4 && fy >= 2 && fy <= 4);
    } else on = rnd() > 0.52;
    if (on) out += `<rect x="${x * c}" y="${y * c}" width="${c}" height="${c}"/>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" fill="#17201C" aria-label="Código QR de ejemplo">${out}</svg>`;
}

function teamRows() {
  const big = departments.filter((d) => d.n >= MIN_GROUP);
  const small = departments.filter((d) => d.n < MIN_GROUP);
  const rows = big.map((d) => ({ ...d }));
  if (small.length) {
    const n = small.reduce((t, d) => t + d.n, 0);
    const w = (k) => small.reduce((t, d) => t + d[k] * d.n, 0) / n;
    rows.push({ name: `Otros equipos (${small.map((d) => d.name).join(" + ")})`, n, active7: small.reduce((t, d) => t + d.active7, 0), steps: w("steps"), vitas: w("vitas"), before: w("before"), merged: true });
  }
  return rows;
}

}

const VIEW_RENDERERS = {
  inicio: viewInicio, retos: viewRetos, clasificaciones: viewClasificaciones, comunicacion: viewComunicacion,
  premios: viewPremios, verificacion: viewVerificacion, informes: viewInformes, ajustes: viewAjustes,
};

// ------------------------------------------------------------------ eventos
document.addEventListener("click", (e) => {
  const t = e.target.closest("button, [data-go]");
  if (!t) return;
  const d = t.dataset;
  if (d.go) return go(d.go);
  if (d.rank) { state.rankScope = d.rank; return render(); }
  if (d.comm) { state.commTab = d.comm; return render(); }
  if (d.report) { state.reportTab = d.report; return render(); }
  if (d.setting) { state.settings[d.setting] = !state.settings[d.setting]; return render(); }
  const w = state.wizard;
  if (d.template) {
    const tp = TEMPLATES.find((x) => x.id === d.template);
    Object.assign(w, { template: tp.id, format: tp.format });
    return render();
  }
  if (d.format) { w.format = d.format; return render(); }
  if (d.rule) { w.rules[d.rule] = !w.rules[d.rule]; return render(); }
  if (d.wtoggle) { w[d.wtoggle] = !w[d.wtoggle]; return render(); }
  if (d.step) { w.step = Number(d.step); return render(); }

  switch (d.action) {
    case "toast": return toast(d.msg);
    case "new-challenge": state.wizard = newWizard(); return go("nuevo-reto");
    case "wnext": w.step++; return render();
    case "wprev": w.step--; return render();
    case "launch": {
      if (!w.name.trim()) { w.step = 1; render(); return toast("Ponle un nombre al reto."); }
      if (w.end < w.start) { w.step = 1; render(); return toast("La fecha de fin es anterior a la de inicio."); }
      const tp = TEMPLATES.find((x) => x.id === w.template);
      state.challenges.splice(1, 0, { id: Date.now(), name: w.name.trim(), template: w.template, status: "programado", start: w.start, end: w.end, format: w.format, goalSteps: Number(w.goalSteps), collective: w.format === "colectivo" ? Number(w.collective) : null, collectiveDone: 0, emoji: tp.emoji, color: tp.color, participants: 0 });
      state.wizard = null;
      go("retos");
      return toast(`«${w.name.trim()}» programado. ${w.invite ? "Se enviarán las invitaciones el día de inicio." : ""}`);
    }
    case "send": {
      const text = $("#msg").value.trim();
      if (!text) return toast("Escribe un mensaje.");
      const channel = $("#channel").value, when = $("#when").value;
      if (when === "Ahora") {
        state.posts.unshift({ who: "org", name: "Empresa Demo", text, when: "ahora", claps: 0, channel });
        state.commTab = "muro";
        render();
        return toast("Publicado en el muro de la plantilla.");
      }
      state.scheduled.push({ when, text, channel });
      render();
      return toast(`Programado para ${when.toLowerCase()}.`);
    }
    case "remove-post": state.posts.splice(Number(d.i), 1); render(); return toast("Publicación retirada del muro.");
    case "flag": {
      const f = state.flags.splice(Number(d.i), 1)[0];
      render();
      return toast(d.ok === "1" ? `Actividad de ${f.id} aceptada.` : `Actividad de ${f.id} anulada. Se le avisará con el motivo.`);
    }
    case "remove-prize": state.prizes.splice(Number(d.i), 1); render(); return toast("Premio retirado del catálogo.");
    case "add-prize":
      $("#prize-form").innerHTML = `<div class="inline-fields" style="margin-top:14px;align-items:end">
        <label class="field">Premio<input id="pName" placeholder="p. ej. Clase de yoga"></label>
        <label class="field">Coste (Vitas)<input id="pCost" type="number" min="50" step="50" value="300"></label>
        <label class="field">Stock<input id="pStock" type="number" min="1" value="20"></label>
        <div style="margin-bottom:12px"><button class="btn" data-action="save-prize">Guardar</button></div></div>`;
      return $("#pName").focus();
    case "save-prize": {
      const name = $("#pName").value.trim();
      if (!name) return toast("Escribe el nombre del premio.");
      state.prizes.push({ name, cost: Number($("#pCost").value) || 300, stock: Number($("#pStock").value) || 20, redeemed: 0, kind: "Empresa" });
      render();
      return toast("Premio añadido al catálogo.");
    }
  }
});

document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.w && state.wizard) {
    state.wizard[t.dataset.w] = t.type === "number" ? Number(t.value) : t.value;
    // Solo se repinta la vista previa para no perder el foco del campo.
    const preview = document.querySelector(".phone");
    if (preview) preview.outerHTML = wizardPreview(state.wizard);
  }
  if (t.id === "tpl" && t.value) $("#msg").value = t.value;
  if (t.dataset.settingSelect) state.settings[t.dataset.settingSelect] = t.value;
});
document.addEventListener("change", (e) => {
  if (e.target.id === "tpl" && e.target.value) $("#msg").value = e.target.value;
});

const initial = location.hash.slice(1);
if (VIEW_RENDERERS[initial]) state.view = initial;
if (initial === "nuevo-reto") { state.wizard = newWizard(); state.view = initial; }
render();
</script>
</body>
</html>
